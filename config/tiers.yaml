# Item Tier Classification Rules for Loretta's Ledger
# Edit this file to adjust which agenda items appear in each tier on the public site:
#   - Tier 1 ("Worth your attention"): Has a brief, is a test case, or matches tier_1_keywords
#   - Tier 2 ("Also on the calendar"): Other substantive items (contracts, resolutions with money or land, briefings)
#   - Tier 3 (Procedural): Never shown as a row on the public site

tier_3_procedural:
  # Exact normalized titles (after removing item numbers like "1.A" and time ranges like "(5:30-5:35 PM)")
  exact_titles:
    - "call to order"
    - "roll call"
    - "approval of agenda"
    - "approval of minutes"
    - "public comment"
    - "announcements"
    - "staff announcements"
    - "others present"
    - "staff present"
    - "committee business"
    - "business item"
    - "business items"
    - "project review"
    - "other"
    - "other business"
    - "adjourn"
    - "adjournment"
    - "recess"
    - "audio"
    - "weekly schedule"
    - "board work session"
    - "presubmission conference"
    - "staff report"
    - "housekeeping report"

  # Substring or prefix patterns (case-insensitive) that mark an item as Tier 3 procedural
  contains_patterns:
    - "call to order"
    - "approval of agenda"
    - "approval of minutes"
    - "meeting minutes"
    - "retreat minutes"
    - "board minutes"
    - "public comment"
    - "staff present"
    - "others present"
    - "please note:"
    - "recess"
    - "adjourn"
    - "follow-up on prac motions"
    - "board work session"
    - "weekly schedule"
    - "planning commission: agenda"
    - "planning commission: minutes"
    - "planning commission: public comment"
    - "business meeting & public hearing(s)"
    - "board of health meeting & public hearing(s)"
    - "sign-in sheet"
    - "chair script"
    - "press release"
    - "webmailer"
    - "dinner and information sharing"
    - "onboarding retreat"
    - "organizational retreat"
    - "commission retreat"
    - "holiday observance"
    - "special recognition - proclamation"
    - "approval of bills"
    - "payroll"
    - "initiative to the legislature"

tier_1_keywords:
  # An item is Tier 1 if it is not Tier 3 AND (has a brief, is a test case, or matches any of these)
  - "public hearing"
  - "ordinance"
  - "code amendment"
  - "code update"
  - "chapter 24."
  - "article iii"
  - "budget"
  - "utility rates"
  - "development fees"
  - "impact fees"
  - "general facility charges"
  - "rate"
  - "rates"
  - "levy"
  - "capital facilities plan"
  - "moratorium"
  - "rezone"

tier_2_keywords:
  # Other substantive items (contracts, agreements, resolutions with money or land, work plans, plats)
  - "contract"
  - "agreement"
  - "resolution"
  - "grant"
  - "funding"
  - "lease"
  - "bid award"
  - "purchase and sale"
  - "plat"
  - "subdivision"
  - "work plan"
  - "briefing"
  - "update"
  - "discussion"
  - "proposal"
  - "recommendation"
  - "case:"
  - "case #"
