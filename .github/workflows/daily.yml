name: Daily Pipeline & Deploy

on:
  schedule:
    # Runs daily at 14:00 UTC (7:00 AM PDT / 6:00 AM PST)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

      - name: Ingest Local Feeds (Olympia & Thurston)
        run: |
          python -m pipeline.ingest --all || true

      - name: Classify Topics, Deadlines & Test Cases
        run: |
          python -m pipeline.classify --all

      - name: Detect Upstream Influences & Citations
        run: |
          python -m pipeline.upstream.detect --all

      - name: Build Lineage Chains & Text Similarity
        run: |
          python -m pipeline.upstream.chains --link
          python -m pipeline.upstream.similarity --run

      - name: Link Cross-Meeting Matters & Timelines
        run: |
          python -m pipeline.matters

      - name: Export Static Site & Documents
        run: |
          python -m pipeline.export --all

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

